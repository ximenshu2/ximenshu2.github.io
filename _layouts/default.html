<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% if page.robots %}<meta name="robots" content="{{ page.robots }}">{% endif %}
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:locale" content="zh_CN">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:type" content="{{ page.og_type | default: 'article' }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/images/privacy-lab-hero.webp' | absolute_url }}">
  {% if page.home %}<link rel="preload" href="{{ '/assets/images/privacy-lab-hero.webp' | relative_url }}" as="image" fetchpriority="high">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "{{ page.schema_type | default: 'WebPage' }}",
    "name": {{ page.title | default: site.title | jsonify }},
    "description": {{ page.description | default: site.description | jsonify }},
    "url": {{ page.url | absolute_url | jsonify }},
    "inLanguage": "zh-CN",
    "isPartOf": {
      "@type": "WebSite",
      "name": {{ site.title | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }}
    }
    {% if page.date_modified %},"dateModified": {{ page.date_modified | jsonify }}{% endif %}
  }
  </script>
</head>
<body class="{% if page.home %}home{% else %}article-page{% endif %}">
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="site-header">
    <div class="nav-shell">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="网络隐私检测指南首页">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>网络隐私检测指南</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="打开导航">
        <span></span><span></span><span></span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="主导航">
        <a href="{{ '/check/is-vpn-working/' | relative_url }}">VPN 自查</a>
        <a href="{{ '/leak/dns-leak-test-guide/' | relative_url }}">DNS</a>
        <a href="{{ '/leak/webrtc-ip-leak-guide/' | relative_url }}">WebRTC</a>
        <a href="{{ '/privacy/what-vpn-does-not-protect/' | relative_url }}">隐私边界</a>
      </nav>
    </div>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer">
    <div><strong>网络隐私检测指南</strong><p>记录测试条件，解释暴露信号，不把一次检测写成绝对安全证明。</p></div>
    <div class="footer-links"><a href="{{ '/check/is-vpn-working/' | relative_url }}">五项检查</a><a href="{{ '/privacy/what-vpn-does-not-protect/' | relative_url }}">隐私边界</a></div>
  </footer>
  <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
