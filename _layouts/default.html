<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">

  <!-- Google tag (gtag.js) -->
  <script
    async
    src="https://www.googletagmanager.com/gtag/js?id=G-8NZ7EJBTK4"
  ></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());
    gtag('config', 'G-8NZ7EJBTK4');
  </script>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="{{ site.theme_color | default: '#147a5b' }}"
  >

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin"
  >

  <title>{% if page.title contains site.title %}{{ page.title | escape }}{% elsif page.home %}{{ page.title | escape }}{% else %}{{ page.title | escape }}｜{{ site.title | escape }}{% endif %}</title>

  <meta
    name="description"
    content="{{ page.description | default: site.description | escape }}"
  >

  <meta
    name="robots"
    content="{{ page.robots | default: 'index, follow, max-image-preview:large' | escape }}"
  >

  <link
    rel="canonical"
    href="{{ page.url | absolute_url }}"
  >

  <link
    rel="icon"
    type="image/svg+xml"
    href="{{ '/assets/images/favicon.svg' | relative_url }}"
  >

  <link
    rel="shortcut icon"
    href="{{ '/assets/images/favicon.svg' | relative_url }}"
  >

  <meta
    property="og:locale"
    content="zh_CN"
  >

  <meta
    property="og:site_name"
    content="{{ site.title | escape }}"
  >

  <meta
    property="og:type"
    content="{% if page.schema_type == 'Article' %}article{% else %}website{% endif %}"
  >

  <meta
    property="og:title"
    content="{{ page.title | default: site.title | escape }}"
  >

  <meta
    property="og:description"
    content="{{ page.description | default: site.description | escape }}"
  >

  <meta
    property="og:url"
    content="{{ page.url | absolute_url }}"
  >

  <meta
    property="og:image"
    content="{{ '/assets/images/privacy-lab-hero.webp' | absolute_url }}"
  >

  <meta
    property="og:image:width"
    content="1717"
  >

  <meta
    property="og:image:height"
    content="916"
  >

  <meta
    property="og:image:type"
    content="image/webp"
  >

  <meta
    property="og:image:alt"
    content="网络隐私检测指南：VPN、IP、DNS 与 WebRTC 检测"
  >

  {% if page.schema_type == "Article" and page.date_published %}
  <meta
    property="article:published_time"
    content="{{ page.date_published | date_to_xmlschema }}"
  >
  {% endif %}

  {% if page.schema_type == "Article" and page.date_modified %}
  <meta
    property="article:modified_time"
    content="{{ page.date_modified | date_to_xmlschema }}"
  >
  {% endif %}

  <meta
    name="twitter:card"
    content="summary_large_image"
  >

  <meta
    name="twitter:title"
    content="{{ page.title | default: site.title | escape }}"
  >

  <meta
    name="twitter:description"
    content="{{ page.description | default: site.description | escape }}"
  >

  <meta
    name="twitter:image"
    content="{{ '/assets/images/privacy-lab-hero.webp' | absolute_url }}"
  >

  <meta
    name="twitter:image:alt"
    content="网络隐私检测指南：VPN、IP、DNS 与 WebRTC 检测"
  >

  {% if page.home %}
  <link
    rel="preload"
    href="{{ '/assets/images/privacy-lab-hero.webp' | relative_url }}"
    as="image"
    fetchpriority="high"
  >
  {% endif %}

  <link
    rel="stylesheet"
    href="{{ '/assets/css/style.css' | relative_url }}"
  >

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "{{ page.schema_type | default: 'WebPage' }}",

    "name": {{ page.title | default: site.title | jsonify }},

    {% if page.schema_type == "Article" %}
    "headline": {{ page.title | jsonify }},
    {% endif %}

    "description": {{ page.description | default: site.description | jsonify }},

    "url": {{ page.url | absolute_url | jsonify }},

    "inLanguage": "zh-CN",

    "image": {
      "@type": "ImageObject",
      "url": {{ '/assets/images/privacy-lab-hero.webp' | absolute_url | jsonify }},
      "width": 1717,
      "height": 916
    },

    {% if page.schema_type == "Article" %}
    "mainEntityOfPage": {
      "@type": "WebPage",
      "@id": {{ page.url | absolute_url | jsonify }}
    },
    {% endif %}

    "isPartOf": {
      "@type": "WebSite",
      "name": {{ site.title | jsonify }},
      "url": {{ '/' | absolute_url | jsonify }}
    }

    {% if page.date_published %},
    "datePublished": {{ page.date_published | date_to_xmlschema | jsonify }}
    {% endif %}

    {% if page.date_modified %},
    "dateModified": {{ page.date_modified | date_to_xmlschema | jsonify }}
    {% endif %}
  }
  </script>
</head>

<body class="{% if page.home %}home{% else %}article-page{% endif %}">

  <a
    class="skip-link"
    href="#main"
  >
    跳到正文
  </a>

  <header class="site-header">
    <div class="nav-shell">

      <a
        class="brand"
        href="{{ '/' | relative_url }}"
        aria-label="网络隐私检测指南首页"
        {% if page.url == '/' %}aria-current="page"{% endif %}
      >
        <span
          class="brand-mark"
          aria-hidden="true"
        ></span>

        <span>网络隐私检测指南</span>
      </a>

      <button
        class="nav-toggle"
        type="button"
        aria-expanded="false"
        aria-controls="site-nav"
        aria-label="打开导航"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>

      <nav
        id="site-nav"
        class="site-nav"
        aria-label="主导航"
      >
        <a
          href="{{ '/check/is-vpn-working/' | relative_url }}"
          {% if page.url == '/check/is-vpn-working/' %}aria-current="page"{% endif %}
        >
          VPN 自查
        </a>

        <a
          href="{{ '/leak/dns-leak-test-guide/' | relative_url }}"
          {% if page.url == '/leak/dns-leak-test-guide/' %}aria-current="page"{% endif %}
        >
          DNS
        </a>

        <a
          href="{{ '/leak/webrtc-ip-leak-guide/' | relative_url }}"
          {% if page.url == '/leak/webrtc-ip-leak-guide/' %}aria-current="page"{% endif %}
        >
          WebRTC
        </a>

        <a
          href="{{ '/privacy/what-vpn-does-not-protect/' | relative_url }}"
          {% if page.url == '/privacy/what-vpn-does-not-protect/' %}aria-current="page"{% endif %}
        >
          隐私边界
        </a>
      </nav>

    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  <footer class="site-footer">

    <div>
      <strong>网络隐私检测指南</strong>

      <p>
        记录测试条件，解释暴露信号，不把一次检测写成绝对安全证明。
      </p>
    </div>

    <nav
      class="footer-links"
      aria-label="页脚导航"
    >

      <a href="{{ '/check/is-vpn-working/' | relative_url }}">
        VPN 自查
      </a>

      <a href="{{ '/privacy/what-vpn-does-not-protect/' | relative_url }}">
        隐私边界
      </a>

      <a href="{{ '/about/' | relative_url }}">
        关于本站
      </a>

      <a href="{{ '/privacy-policy/' | relative_url }}">
        隐私说明
      </a>

    </nav>

  </footer>

  <script
    src="{{ '/assets/js/site.js' | relative_url }}"
    defer
  ></script>

</body>
</html>
